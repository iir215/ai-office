version: "3.9"

services:
  api:
    build: ./backend
    container_name: aion_api
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
    - ./backend/alembic:/app/alembic
    depends_on:
      - postgres
      - redis

  worker:
    build: ./backend
    container_name: aion_worker
    env_file:
      - ./backend/.env
    command: sh -c "rq worker agent_tasks --url $${REDIS_URL}"
    depends_on:
      - postgres
      - redis

  telegram_bot:
    build: ./backend
    container_name: aion_telegram_bot
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
    command: python -m app.telegram_bot
    depends_on:
      - postgres
      - redis

  security_auditor:
    build: ./backend
    container_name: aion_security_auditor
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
    command: python -m app.security_auditor
    depends_on:
      - postgres

  instagram_support:
    build: ./backend
    container_name: aion_instagram_support
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
    command: python -m app.instagram_support
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    container_name: aion_postgres
    restart: always
    environment:
      POSTGRES_DB: aion
      POSTGRES_USER: aion
      POSTGRES_PASSWORD: aion
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: aion_redis

volumes:
  postgres_data:
